<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecânicos - Gestão de Oficina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
        .card-header-custom { background: #ffffff; border-bottom: 1px solid #e2e8f0; }
        .table > :not(caption) > * > * { vertical-align: middle; }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar('mecanicos')}"></div>

<div class="container pb-5">
    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-people-fill text-primary me-2"></i>Equipe de Mecânicos</h2>
            <p class="text-muted mb-0">Gerencie os profissionais e suas especialidades técnicas</p>
        </div>
        <a th:href="@{/mecanicos/novo}" class="btn btn-primary shadow-sm">
            <i class="bi bi-person-plus-fill me-1"></i> Novo Mecânico
        </a>
    </div>

    <!-- Tabela de Mecânicos -->
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header card-header-custom py-3">
            <h5 class="card-title mb-0 fw-semibold text-secondary">
                <i class="bi bi-tools me-1"></i> Mecânicos Cadastrados
            </h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Nome</th>
                            <th>Especialidade</th>
                            <th class="text-end pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(mecanicos)}">
                            <td colspan="3" class="text-center py-5 text-muted">
                                <i class="bi bi-person-x fs-1 d-block mb-2"></i>
                                Nenhum mecânico cadastrado no momento.
                            </td>
                        </tr>
                        <tr th:each="m : ${mecanicos}">
                            <td class="ps-4 fw-semibold">
                                <i class="bi bi-person-badge text-primary me-2"></i>
                                <span th:text="${m.nome}">Carlos Souza</span>
                            </td>
                            <td>
                                <span th:if="${m.especialidade == T(com.estudos.gestaoDeOficinaMecanica.database.model.Especialidade).Motor}" 
                                      class="badge bg-danger-subtle text-danger border border-danger-subtle">
                                    <i class="bi bi-gear-fill me-1"></i> Motor
                                </span>
                                <span th:if="${m.especialidade == T(com.estudos.gestaoDeOficinaMecanica.database.model.Especialidade).Eletrica}" 
                                      class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle">
                                    <i class="bi bi-lightning-charge-fill me-1"></i> Elétrica
                                </span>
                                <span th:if="${m.especialidade == T(com.estudos.gestaoDeOficinaMecanica.database.model.Especialidade).Supensâo}" 
                                      class="badge bg-info-subtle text-info-emphasis border border-info-subtle">
                                    <i class="bi bi-car-front-fill me-1"></i> Suspensão
                                </span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/mecanicos/editar/{id}(id=${m.id})}" class="btn btn-outline-primary btn-sm me-1" title="Editar">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </a>
                                <a th:href="@{/mecanicos/excluir/{id}(id=${m.id})}" class="btn btn-outline-danger btn-sm" 
                                   onclick="return confirm('Tem certeza que deseja excluir este mecânico?');" title="Excluir">
                                    <i class="bi bi-trash3"></i> Excluir
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
