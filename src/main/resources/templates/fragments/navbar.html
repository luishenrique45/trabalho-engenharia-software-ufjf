<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Navbar Fragment -->
<div th:fragment="navbar(activeTab)">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/ordens}">
                <i class="bi bi-wrench-adjustable-circle-fill text-primary fs-3 me-2"></i>
                Gestão de Oficina
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeTab == 'ordens'} ? 'active fw-bold' : ''" th:href="@{/ordens}">
                            <i class="bi bi-card-checklist me-1"></i> Ordens de Serviço
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeTab == 'mecanicos'} ? 'active fw-bold' : ''" th:href="@{/mecanicos}">
                            <i class="bi bi-people-fill me-1"></i> Mecânicos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeTab == 'usuarios'} ? 'active fw-bold' : ''" th:href="@{/usuarios}">
                            <i class="bi bi-person-badge-fill me-1"></i> Usuários
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="navbar-text me-3 text-light small d-none d-md-inline" sec:authorize="isAuthenticated()">
                        <i class="bi bi-person-circle me-1"></i> <span sec:authentication="name"></span>
                    </span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i> Sair
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Alertas Globais -->
    <div class="container">
        <!-- Alerta de Erro Vermelho -->
        <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show shadow-sm d-flex align-items-center mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-4 me-3 text-danger"></i>
            <div>
                <strong>Atenção:</strong> <span th:text="${mensagemErro}"></span>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Alerta de Sucesso Verde -->
        <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm d-flex align-items-center mb-4" role="alert">
            <i class="bi bi-check-circle-fill fs-4 me-3 text-success"></i>
            <div>
                <strong>Sucesso:</strong> <span th:text="${mensagemSucesso}"></span>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
</div>

</body>
</html>
