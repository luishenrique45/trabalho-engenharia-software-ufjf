<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Ordem de Serviço - Oficina Mecânica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar('ordens')}"></div>

<div class="container pb-5" style="max-width: 800px;">
    <!-- Breadcrumb e Voltar -->
    <div class="mb-3">
        <a th:href="@{/ordens}" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i> Voltar para o Dashboard
        </a>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-white py-3 border-bottom">
            <h4 class="card-title mb-0 fw-bold text-primary">
                <i class="bi bi-file-earmark-plus me-2"></i>Nova Ordem de Serviço
            </h4>
            <p class="text-muted small mb-0 mt-1">Preencha os dados do serviço a ser executado.</p>
        </div>
        <div class="card-body p-4">

            <form th:action="@{/ordens/salvar}" th:object="${ordem}" method="post">
                <!-- Descrição do Serviço -->
                <div class="mb-3">
                    <label for="descricao" class="form-label fw-semibold">Descrição do Reparo / Problema <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="descricao" th:field="*{descricao}" rows="3" 
                              placeholder="Ex: Troca da correia dentada e revisão do cabeçote" required></textarea>
                </div>

                <!-- Tipo de Serviço (Especialidade) -->
                <div class="mb-3">
                    <label for="tipoServico" class="form-label fw-semibold">Tipo de Serviço (Especialidade Requerida) <span class="text-danger">*</span></label>
                    <select class="form-select" id="tipoServico" th:field="*{tipoServico}" required>
                        <option value="" disabled selected>Selecione a especialidade necessária...</option>
                        <option th:each="esp : ${T(com.estudos.gestaoDeOficinaMecanica.database.model.Especialidade).values()}"
                                th:value="${esp}"
                                th:text="${esp}">Motor</option>
                    </select>
                    <div class="form-text text-muted">
                        <i class="bi bi-info-circle me-1"></i>Apenas mecânicos com esta especialidade poderão assumir o serviço.
                    </div>
                </div>

                <!-- Mecânico Responsável -->
                <div class="mb-4">
                    <label for="mecanico" class="form-label fw-semibold">Mecânico Atribuído</label>
                    <select class="form-select" id="mecanico" th:field="*{mecanico.id}">
                        <option value="">Selecione um mecânico (opcional)...</option>
                        <option th:each="mec : ${mecanicos}"
                                th:value="${mec.id}"
                                th:text="${mec.nome} + ' (Especialista em: ' + ${mec.especialidade} + ')'">João (Motor)</option>
                    </select>
                </div>

                <!-- Peças Necessárias -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Peças Necessárias (Estoque do Fornecedor)</label>
                    <div class="card p-3 bg-light border-0 rounded-3">
                        <div th:if="${#lists.isEmpty(pecas)}" class="text-muted small">
                            Nenhuma peça cadastrada no sistema.
                        </div>
                        <div th:each="p : ${pecas}" class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" th:field="*{peca}" th:value="${p.id}" th:id="'peca_' + ${p.id}">
                            <label class="form-check-label d-flex justify-content-between align-items-center" th:for="'peca_' + ${p.id}">
                                <span>
                                    <strong th:text="${p.nome}">Filtro de Óleo</strong>
                                    <span class="text-muted small ms-2" th:text="'(Fornecedor: ' + ${p.fornecedor} + ')'"></span>
                                </span>
                                <span th:if="${p.quantidadeEstoque > 0}" class="badge bg-success-subtle text-success border border-success-subtle"
                                      th:text="'Estoque: ' + ${p.quantidadeEstoque}">Estoque: 10</span>
                                <span th:if="${p.quantidadeEstoque <= 0}" class="badge bg-danger-subtle text-danger border border-danger-subtle">
                                    <i class="bi bi-x-circle me-1"></i> Sem estoque (0)
                                </span>
                            </label>
                        </div>
                    </div>
                    <div class="form-text text-muted">
                        <i class="bi bi-exclamation-circle me-1"></i>Ordens com peças zeradas não poderão ser iniciadas.
                    </div>
                </div>

                <!-- Botões -->
                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a th:href="@{/ordens}" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm">
                        <i class="bi bi-check2-circle me-1"></i> Abrir Ordem de Serviço
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
