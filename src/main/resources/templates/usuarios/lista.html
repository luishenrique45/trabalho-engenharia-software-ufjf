<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - Gestão de Oficina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
        .card-header-custom { background: #ffffff; border-bottom: 1px solid #e2e8f0; }
        .table > :not(caption) > * > * { vertical-align: middle; }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar('usuarios')}"></div>

<div class="container pb-5">
    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-person-badge-fill text-primary me-2"></i>Controle de Acesso & Usuários</h2>
            <p class="text-muted mb-0">Gerencie as credenciais e acessos dos mecânicos e administradores</p>
        </div>
        <a th:href="@{/usuarios/novo}" class="btn btn-primary shadow-sm">
            <i class="bi bi-person-plus-fill me-1"></i> Novo Usuário
        </a>
    </div>

    <!-- Tabela de Usuários -->
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header card-header-custom py-3">
            <h5 class="card-title mb-0 fw-semibold text-secondary">
                <i class="bi bi-shield-lock me-1"></i> Contas Cadastradas
            </h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Login / Usuário</th>
                            <th>Nível de Acesso (Papel)</th>
                            <th>Mecânico Associado</th>
                            <th class="text-end pe-4">Ação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="4" class="text-center py-5 text-muted">
                                <i class="bi bi-people fs-1 d-block mb-2"></i>
                                Nenhum usuário cadastrado no momento.
                            </td>
                        </tr>
                        <tr th:each="u : ${usuarios}">
                            <td class="ps-4 fw-semibold">
                                <i class="bi bi-person-circle text-secondary me-2"></i>
                                <span th:text="${u.login}">joao.mecanico</span>
                            </td>
                            <td>
                                <span th:if="${u.papel == 'ADMIN'}" class="badge bg-danger">ADMIN</span>
                                <span th:if="${u.papel == 'MECANICO'}" class="badge bg-primary">MECÂNICO</span>
                                <span th:if="${u.papel != 'ADMIN' and u.papel != 'MECANICO'}" class="badge bg-secondary" th:text="${u.papel}"></span>
                            </td>
                            <td>
                                <span th:if="${u.mecanico != null}">
                                    <i class="bi bi-wrench text-muted me-1"></i>
                                    <span th:text="${u.mecanico.nome}">João</span>
                                    <small class="text-muted" th:text="'(' + ${u.mecanico.especialidade} + ')'"></small>
                                </span>
                                <span th:if="${u.mecanico == null}" class="text-muted fst-italic">Nenhum</span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/usuarios/excluir/{id}(id=${u.id})}" class="btn btn-outline-danger btn-sm"
                                   onclick="return confirm('Tem certeza que deseja excluir esta conta de usuário?');" title="Excluir">
                                    <i class="bi bi-trash3"></i> Excluir
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
