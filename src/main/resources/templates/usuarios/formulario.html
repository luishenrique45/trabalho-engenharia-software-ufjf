<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Usuário - Gestão de Oficina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar('usuarios')}"></div>

<div class="container pb-5" style="max-width: 650px;">
    <!-- Voltar -->
    <div class="mb-3">
        <a th:href="@{/usuarios}" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i> Voltar para a lista de usuários
        </a>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-white py-3 border-bottom">
            <h4 class="card-title mb-0 fw-bold text-primary">
                <i class="bi bi-person-plus-fill me-2"></i>Cadastrar Novo Usuário
            </h4>
            <p class="text-muted small mb-0 mt-1">Crie as credenciais de acesso para um membro da equipe.</p>
        </div>
        <div class="card-body p-4">

            <form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
                <!-- Login -->
                <div class="mb-3">
                    <label for="login" class="form-label fw-semibold">Nome de Usuário / Login <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="login" th:field="*{login}" 
                               placeholder="Ex: joao.silva" required maxlength="50" autofocus />
                    </div>
                </div>

                <!-- Senha -->
                <div class="mb-3">
                    <label for="senha" class="form-label fw-semibold">Senha de Acesso <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="senha" th:field="*{senha}" 
                               placeholder="Digite uma senha segura" required />
                    </div>
                </div>

                <!-- Papel / Perfil -->
                <div class="mb-3">
                    <label for="papel" class="form-label fw-semibold">Nível de Acesso (Papel) <span class="text-danger">*</span></label>
                    <select class="form-select" id="papel" th:field="*{papel}" required>
                        <option value="MECANICO" selected>MECÂNICO</option>
                        <option value="ADMIN">ADMINISTRADOR</option>
                    </select>
                </div>

                <!-- Vincular ao Mecânico -->
                <div class="mb-4">
                    <label for="mecanico" class="form-label fw-semibold">Vincular a um Mecânico Cadastrado</label>
                    <select class="form-select" id="mecanico" th:field="*{mecanico.id}">
                        <option value="">Nenhum (Apenas conta de sistema)...</option>
                        <option th:each="m : ${mecanicos}" 
                                th:value="${m.id}" 
                                th:text="${m.nome} + ' (' + ${m.especialidade} + ')'">João (Motor)</option>
                    </select>
                    <div class="form-text text-muted">
                        <i class="bi bi-link-45deg me-1"></i>Conecta este login ao perfil do mecânico da oficina.
                    </div>
                </div>

                <!-- Botões -->
                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a th:href="@{/usuarios}" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm">
                        <i class="bi bi-check2-circle me-1"></i> Salvar Usuário
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
