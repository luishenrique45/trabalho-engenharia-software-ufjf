<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecânico - Gestão de Oficina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar('mecanicos')}"></div>

<div class="container pb-5" style="max-width: 650px;">
    <!-- Voltar -->
    <div class="mb-3">
        <a th:href="@{/mecanicos}" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i> Voltar para a lista de mecânicos
        </a>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-white py-3 border-bottom">
            <h4 class="card-title mb-0 fw-bold text-primary">
                <i class="bi bi-person-fill-gear me-2"></i>
                <span th:text="${mecanico.id == null} ? 'Cadastrar Novo Mecânico' : 'Editar Mecânico'">Cadastrar Novo Mecânico</span>
            </h4>
            <p class="text-muted small mb-0 mt-1">Informe os dados profissionais do mecânico.</p>
        </div>
        <div class="card-body p-4">

            <form th:action="@{/mecanicos/salvar}" th:object="${mecanico}" method="post">
                <!-- ID oculto para edição -->
                <input type="hidden" th:field="*{id}" />

                <!-- Nome -->
                <div class="mb-3">
                    <label for="nome" class="form-label fw-semibold">Nome Completo <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="nome" th:field="*{nome}" 
                           placeholder="Ex: João da Silva" required maxlength="100" />
                </div>

                <!-- Especialidade -->
                <div class="mb-4">
                    <label for="especialidade" class="form-label fw-semibold">Especialidade Técnica <span class="text-danger">*</span></label>
                    <select class="form-select" id="especialidade" th:field="*{especialidade}" required>
                        <option value="" disabled selected>Selecione uma especialidade...</option>
                        <option th:each="esp : ${T(com.estudos.gestaoDeOficinaMecanica.database.model.Especialidade).values()}"
                                th:value="${esp}"
                                th:text="${esp}">Motor</option>
                    </select>
                    <div class="form-text text-muted">
                        <i class="bi bi-info-circle me-1"></i>Esta especialidade determinará quais Ordens de Serviço ele poderá atender.
                    </div>
                </div>

                <!-- Botões -->
                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a th:href="@{/mecanicos}" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm">
                        <i class="bi bi-check2-circle me-1"></i> Salvar Mecânico
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
